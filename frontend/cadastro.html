<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SENA - Criar Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="registramento.css">
</head>
<body>
    <main class="container">
        <form id="formCadastro">
            <div class="header">
                <div class="logo-wrapper">
                    <div class="logo-box">S</div>
                    <span class="logo-text">SENA</span>
                </div>
                <p>Crie sua conta</p>
            </div>

            <div class="input-group">
                <label>Nome completo <span style="color:red">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nome" placeholder="Nome completo" required>
                </div>
            </div>

            <div class="input-group">
                <label>E-mail <span style="color:red">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="E-mail" required>
                </div>
            </div>

            <div class="account-type-group">
                <label>Tipo de Conta</label>
                <div class="radio-cards-container">
                    <label class="radio-card">
                        <input type="radio" name="tipoConta" value="Hóspede" checked>
                        <div class="card-content">
                            <div class="radio-circle"></div>
                            <div class="text">
                                <strong>Hóspede</strong>
                                <span>Buscar moradias</span>
                            </div>
                        </div>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="tipoConta" value="Anfitrião">
                        <div class="card-content">
                            <div class="radio-circle"></div>
                            <div class="text">
                                <strong>Anfitrião</strong>
                                <span>Anunciar moradias</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label>Senha <span style="color:red">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="Senha" required>
                </div>
                <span class="help-text">Mínimo 6 caracteres</span>
            </div>

            <div class="input-group">
                <label>Confirmar Senha <span style="color:red">*</span></label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmarSenha" placeholder="Confirmar Senha" required>
                </div>
            </div>

            <button type="submit" class="btn-login" style="margin-top: 15px;">Criar Conta</button>

            <div class="register-link" style="margin-top: 20px;">
                <p>Já tem conta? <a href="login.html">Faça login</a></p>
            </div>
        </form>
    </main>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const tipoConta = document.querySelector('input[name="tipoConta"]:checked').value;
            
            if (senha.length < 6) {
                alert("A senha deve ter no mínimo 6 caracteres.");
                return;
            }

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            fetch('/api/cadastro', {
                method: 'POST',
                body: `${nome}:${email}:${senha}:${tipoConta}`
            })
            .then(res => res.text().then(msg => ({status: res.status, msg: msg})))
            .then(data => {
                alert(data.msg);
                if(data.status === 200) window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
