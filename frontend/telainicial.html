<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SENA - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="bairros.css">
    <link rel="stylesheet" href="telainicial.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">SENA</div>
        <nav class="menu-central">
            <a href="telainicial.html" class="btn-nav-active">Buscar Moradia</a>
            <a href="bairros.html">Explorar Bairros</a>
            <a href="cadastro-imovel.html" id="link-cadastro-imovel">Cadastro de imóvel</a>
            <a href="sobrenos.html">Sobre nós</a>
        </nav>
        <div class="auth-group"><a href="login.html" class="btn-cadastrar" style="background-color: #64748b;">Sair</a></div>
    </header>
    <section class="hero-header">
        <h1>Moradias <span>Disponíveis</span></h1>
        <p>Encontre o local ideal com segurança garantida.</p>
    </section>
    <main class="container"><div class="grid-bairros" id="lista-imoveis"></div></main>
    <div class="chat-container">
        <button class="chat-btn" id="chatBtn" onclick="toggleChat()"><i class="fa-solid fa-comments"></i> Suporte Sena</button>
        <div class="chat-window hidden" id="chatWindow">
            <div class="chat-header"><span>Suporte</span><button onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="chat-messages" id="chatMessages"><div class="msg bot-msg">Olá! Como posso ajudar hoje?</div></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                <button onclick="enviarMensagem()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <script>
        if (localStorage.getItem('tipoContaSena') === 'Hóspede') document.getElementById('link-cadastro-imovel').style.display = 'none';
        fetch('/api/imoveis').then(r => r.json()).then(imoveis => {
            imoveis.forEach(i => {
                document.getElementById('lista-imoveis').innerHTML += `<div class="card"><div class="card-image" style="background-image: url('${i.imagem}')"></div><div class="card-content"><h3>${i.titulo}</h3><p class="location"><i class="fa-solid fa-location-dot"></i> ${i.localizacao}</p><div class="card-footer"><span style="font-weight:bold; color:#1b7a6b;">R$ ${i.preco}/mês</span><button class="btn-detalhes">Detalhes</button></div></div></div>`;
            });
        });
        function toggleChat() { document.getElementById('chatWindow').classList.toggle('hidden'); document.getElementById('chatBtn').classList.toggle('hidden'); }
        function handleEnter(e) { if (e.key === 'Enter') enviarMensagem(); }
        function enviarMensagem() {
            const input = document.getElementById('chatInput');
            const msgText = input.value.trim();
            if (!msgText) return;
            addMsg(msgText, 'user-msg'); input.value = '';
            fetch('/api/chat', { method: 'POST', body: msgText }).then(r => r.text()).then(bot => addMsg(bot, 'bot-msg'));
        }
        function addMsg(texto, classe) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div'); msgDiv.className = `msg ${classe}`; msgDiv.innerText = texto;
            chatMessages.appendChild(msgDiv); chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
