<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="registramento.css">
    <title>SENA - Login</title>
</head>
<body>
    <main class="container">
        <form id="formLogin">
            <div class="header">
                <div class="logo-wrapper">
                    <div class="logo-box">S</div>
                    <span class="logo-text">SENA</span>
                </div>
                <p>Bem-vindo de volta</p>
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
            </div>
            <div class="input-group">
                <div class="label-row">
                    <label>Senha</label>
                    <a href="recsenha.html" class="forgot-link">Esqueceu a senha?</a>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
            
            <div class="divider">
                <span>ou</span>
            </div>

            <div class="register-link">
                <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>

            <div class="security-badge-footer">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Conexão segura e criptografada</span>
            </div>
        </form>
    </main>
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/login', { method: 'POST', body: document.getElementById('email').value + ':' + document.getElementById('password').value })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(res => {
                alert(res.body.msg);
                if (res.status === 200) {
                    localStorage.setItem('tipoContaSena', res.body.tipo);
                    window.location.href = "telainicial.html";
                }
            });
        });
    </script>
</body>
</html>
