<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="registramento.css">
    <title>SENA - Login</title>
</head>
<body>
    <main class="container">
        <form id="formLogin">
            <div class="header">
                <div class="logo-box">S</div>
                <h1>SENA</h1>
                <p>Bem-vindo de volta</p>
            </div>
            <div class="input-group">
                <label>Email</label>
                <div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="email" required></div>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="password" required></div>
            </div>
            <a href="recsenha.html" class="forgot-link">Esqueceu a senha?</a>
            <button type="submit" class="btn-login">Entrar</button>
            <div class="register-link" style="margin-top:20px;">
                <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </form>
    </main>
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/login', { method: 'POST', body: document.getElementById('email').value + ':' + document.getElementById('password').value })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(res => {
                alert(res.body.msg);
                if (res.status === 200) {
                    localStorage.setItem('tipoContaSena', res.body.tipo);
                    window.location.href = "telainicial.html";
                }
            });
        });
    </script>
</body>
</html>
